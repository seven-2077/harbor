; 选题 B 固件骨架（可稍后在有实物与工具链的机器上编译、烧录）
; 本文件不能证明已经实机烧录。云电脑上没有这块板。
;
; 板型：主人说的是「STM32F4ZGT6」。按 ST 常见命名推断为 STM32F407ZGT6
; （LQFP144，通常 1MB Flash / 192KB SRAM）。这是推断，未见到实物丝印或标签，
; 不要把它写成已核实的完整型号。若实物是其它 F4x ZGT6，需要改 board 字段。
;
; board 标识 genericSTM32F407ZGT6 是按 PlatformIO ststm32 平台的常见命名假设，
; 编译前请用 `pio boards` 核对。

[env:genericSTM32F407ZGT6]
platform = ststm32
board = genericSTM32F407ZGT6
framework = stm32cube
monitor_speed = 115200
build_src_filter = +<src/>
build_flags =
    -I include
